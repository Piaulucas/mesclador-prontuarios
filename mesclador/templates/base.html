<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Área de trabalho{% endblock %}</title>
<style>
  :root {
    color-scheme: light;
    --fundo: #f1f5f4;
    --painel: #ffffff;
    --borda: #cbd9d6;
    --texto: #172b31;
    --suave: #52666b;
    --acento: #086b55;
    --acento-txt: #ffffff;
    --ok: #176b4e;
    --erro: #9b432a;
    --alvo: #e2f2f0;
    --topo: 64px;
    --painel-suave: #f7faf9;
    --sombra: 0 2px 14px rgba(23, 43, 49, .055);
    --foco: #086b55;
    --aviso-fundo: #fff2e9;
    --aviso-borda: #d5946c;
    --ok-fundo: #e6f5ee;
    --ok-borda: #80baa1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --fundo: #101d21;
      --painel: #19292e;
      --borda: #3b555a;
      --texto: #e9f2f1;
      --suave: #b0c4c5;
      --acento: #83dbb9;
      --acento-txt: #09292d;
      --ok: #82d4aa;
      --erro: #ffc0a3;
      --alvo: #214446;
      --painel-suave: #1d3136;
      --sombra: 0 2px 16px rgba(0, 0, 0, .16);
      --foco: #a9e8ca;
      --aviso-fundo: #493127;
      --aviso-borda: #bb7755;
      --ok-fundo: #1b4035;
      --ok-borda: #4a9b76;
    }
  }
  * { box-sizing: border-box; }
  html { min-width: 320px; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--fundo);
    color: var(--texto);
  }
  button, input, select { font: inherit; }
  button, a, input, select { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
  .cartao:focus-visible {
    outline: 3px solid var(--foco);
    outline-offset: 2px;
  }
  .topo {
    min-height: var(--topo);
    display: flex;
    align-items: center;
    gap: 30px;
    padding: 0 24px;
    background: var(--painel);
    border-bottom: 1px solid var(--borda);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .marca { display: flex; align-items: center; gap: 12px; white-space: nowrap; min-width: 0; }
  .marca-app { font-size: 18px; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
  .marca-divisor { width: 1px; height: 22px; background: var(--borda); flex: none; }
  .marca-local { display: inline-flex; align-items: center; gap: 7px; color: var(--suave);
                 font-size: 12px; font-weight: 600; line-height: 1.15; }
  .marca-local img { display: block; width: 42px; height: 42px; object-fit: contain;
                     border: 1px solid var(--borda); border-radius: 7px; background: #fff; }
  .marca-local img[hidden] { display: none; }
  .marca-reserva { display: inline-flex; align-items: center; }
  .abas { display: flex; align-items: stretch; gap: 4px; align-self: stretch; }
  .abas a { display: flex; align-items: center; min-height: 40px; padding: 0 13px;
            border-bottom: 3px solid transparent; color: var(--suave);
            text-decoration: none; font-weight: 650; white-space: nowrap; }
  .abas a:hover { color: var(--texto); background: var(--painel-suave); }
  .abas a.ativa { color: var(--acento); border-bottom-color: var(--acento); }
  .menu-ferramentas { position: relative; display: flex; align-items: stretch; }
  .menu-ferramentas summary { display: flex; align-items: center; min-height: 40px; padding: 0 13px;
    border-bottom: 3px solid transparent; color: var(--suave); font-weight: 650;
    cursor: pointer; list-style: none; white-space: nowrap; }
  .menu-ferramentas summary::-webkit-details-marker { display: none; }
  .menu-ferramentas summary:hover, .menu-ferramentas[open] summary { color: var(--texto); background: var(--painel-suave); }
  .menu-ferramentas summary.ativa { color: var(--acento); border-bottom-color: var(--acento); }
  .menu-ferramentas summary:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
  .menu-opcoes { position: absolute; top: 100%; left: 0; min-width: 190px; padding: 5px;
    background: var(--painel); border: 1px solid var(--borda); border-radius: 8px;
    box-shadow: var(--sombra); z-index: 11; }
  .menu-opcoes a { min-height: 38px; padding: 7px 10px; border: 0; border-radius: 5px; }
  .horas-indicador { margin-left: auto; padding: 6px 12px; color: var(--acento); text-decoration: none;
    font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums;
    background: transparent; border: 1px solid var(--acento); border-radius: 6px; }
  .horas-indicador:hover { background: var(--painel-suave); }
  .horas-indicador[hidden] { display: none; }
  .horas-indicador:not([hidden]) + .encerrar { margin-left: 0; }
  .topo .encerrar { margin-left: auto; color: var(--suave); font-size: 12px;
                    background: transparent; border: 1px solid transparent; white-space: nowrap; }
  .topo .encerrar:hover { border-color: var(--borda); color: var(--texto); }
  .app { display: grid; grid-template-columns: minmax(338px, 370px) minmax(0, 1fr);
         min-height: calc(100vh - var(--topo)); }
  aside { background: var(--painel); border-right: 1px solid var(--borda); padding: 24px 22px 18px;
          display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .painel-titulo { margin: 0 0 3px; font-size: 21px; line-height: 1.2; letter-spacing: -.03em; }
  .painel-intro { margin: 0; color: var(--suave); font-size: 13px; }
  .etapa { display: flex; flex-direction: column; gap: 11px; }
  .etapa-cabecalho { display: flex; align-items: baseline; gap: 9px; padding-bottom: 6px;
                     border-bottom: 1px solid var(--borda); }
  .etapa-numero { color: var(--acento); font-size: 12px; font-weight: 800; letter-spacing: .06em; }
  .etapa h2 { margin: 0; font-size: 14px; line-height: 1.3; }
  .etapa-ajuda { margin: 0; color: var(--suave); font-size: 12px; }
  label { display: flex; flex-direction: column; gap: 5px; color: var(--texto);
          font-size: 12px; font-weight: 700; }
  input, select { width: 100%; min-height: 38px; padding: 8px 10px;
                  color: var(--texto); background: var(--painel);
                  border: 1px solid var(--borda); border-radius: 7px; }
  input::placeholder { color: var(--suave); opacity: .85; }
  input[type=checkbox] { width: 16px; min-height: 16px; height: 16px; accent-color: var(--acento); }
  input[type=range] { min-height: 32px; cursor: pointer; }
  .check { min-height: 32px; }
  .msg { font-size: 12px; line-height: 1.45; min-height: 0; color: var(--suave); }
  .msg:empty { display: none; }
  .msg.erro { color: var(--erro); }
  .msg.ok { color: var(--ok); }
  hr { border: 0; border-top: 1px solid var(--borda); margin: 1px 0; width: 100%; }
  button { min-height: 36px; padding: 7px 12px; cursor: pointer; border-radius: 7px;
           border: 1px solid var(--borda); background: var(--painel);
           color: var(--texto); font-weight: 650; }
  button:hover:not(:disabled) { background: var(--painel-suave); border-color: var(--acento); }
  button.principal { min-height: 44px; width: 100%; padding: 10px 14px; font-size: 14px;
                     background: var(--acento); border-color: var(--acento); color: var(--acento-txt);
                     font-weight: 750; }
  button.principal:hover:not(:disabled) { filter: brightness(.92); background: var(--acento); }
  button:disabled { opacity: .5; cursor: default; }
  main { display: flex; flex-direction: column; gap: 16px; min-width: 0; padding: 24px clamp(18px, 3vw, 38px); }
  .area-titulo { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .area-titulo h2 { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -.025em; }
  .area-titulo p { margin: 0; color: var(--suave); font-size: 12px; }
  .zona { padding: 22px 24px; text-align: center; color: var(--suave);
          border: 2px dashed var(--borda); border-radius: 12px;
          background: var(--painel); box-shadow: var(--sombra); }
  .zona.ativa { border-color: var(--acento); background: var(--alvo); color: var(--texto); }
  .zona strong { display: block; color: var(--texto); font-size: 15px; margin-bottom: 3px; }
  .zona .zona-detalhe { display: block; font-size: 12px; }
  .zona .zona-escolhas { display: block; margin-top: 10px; font-size: 12px; }
  .zona .zona-link { min-height: 32px; padding: 3px 4px; border: 0; background: transparent;
                     color: var(--acento); cursor: pointer; text-decoration: underline;
                     text-underline-offset: 2px; font-size: 12px; font-weight: 700; }
  .zona .zona-link:hover:not(:disabled) { border: 0; background: var(--alvo); }
  .barra { display: flex; justify-content: space-between; align-items: center; gap: 12px;
           color: var(--texto); font-size: 13px; font-weight: 700; }
  .barra button { min-height: 32px; font-size: 12px; font-weight: 600; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
           align-content: start; gap: 16px; }
  .cartao { position: relative; min-width: 0; padding: 10px; user-select: none;
            background: var(--painel); border: 1px solid var(--borda);
            border-radius: 11px; box-shadow: var(--sombra); }
  .cartao:hover { border-color: var(--acento); }
  .ordem { position: absolute; top: 17px; left: 17px; z-index: 1; display: grid; place-items: center;
           min-width: 30px; height: 30px; padding: 0 7px; border-radius: 7px;
           background: var(--acento); color: var(--acento-txt); font-size: 13px; font-weight: 800; }
  .mini { height: 260px; position: relative; overflow: hidden; border-radius: 7px;
          background: var(--painel-suave); border: 1px solid var(--borda); }
  .mini img { position: absolute; top: 50%; left: 50%; max-width: 100%; max-height: 100%;
              transition: transform .15s; pointer-events: none; }
  .mini.deitada img { max-width: 250px; max-height: 205px; }
  .nome { margin-top: 9px; font-size: 13px; font-weight: 700;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info { font-size: 12px; color: var(--suave); }
  .acoes { display: flex; gap: 6px; margin-top: 9px; }
  .acoes button { flex: 1; min-height: 34px; padding: 4px 7px; font-size: 12px; }
  .vazio { grid-column: 1 / -1; padding: 44px 20px; text-align: center;
           color: var(--suave); background: var(--painel); border: 1px solid var(--borda);
           border-radius: 10px; font-size: 13px; }
  .assinatura { display: flex; align-items: center; gap: 8px; margin-top: auto;
                padding-top: 16px; border-top: 1px solid var(--borda);
                color: var(--suave); font-size: 12px; }
  .assinatura strong { color: var(--texto); font-weight: 700; }
  .postit-botao { position: fixed; right: 16px; bottom: 16px; z-index: 30;
    background: var(--acento); border-color: var(--acento); color: var(--acento-txt);
    box-shadow: var(--sombra); }
  .postit-botao:hover:not(:disabled) { background: var(--acento); filter: brightness(.92); }
  .postit-painel { position: fixed; right: 16px; bottom: 64px; z-index: 30;
    width: 320px; max-height: min(560px, calc(100dvh - 80px)); overflow-y: auto;
    padding: 15px; background: var(--painel); color: var(--texto);
    border: 1px solid var(--borda); border-radius: 11px; box-shadow: 0 6px 28px rgba(0, 0, 0, .18); }
  .postit-painel[hidden] { display: none; }
  .postit-painel h2 { margin: 0 0 10px; font-size: 17px; }
  .postit-formulario { display: grid; gap: 8px; }
  .postit-formulario button { justify-self: start; }
  .postit-painel label { min-width: 0; }
  .postit-filtro { margin: 14px 0 10px; padding-top: 12px; border-top: 1px solid var(--borda); }
  .postit-grupo { margin: 0 0 12px; }
  .postit-grupo h3 { margin: 0 0 5px; font-size: 13px; overflow-wrap: anywhere; }
  .postit-lista { list-style: none; margin: 0; padding: 0; }
  .postit-lista li { padding: 7px 0; border-top: 1px solid var(--borda); }
  .postit-linha { display: flex; flex-direction: row; align-items: flex-start; gap: 8px;
    font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
  .postit-linha input { flex: none; margin: 2px 0 0; }
  .postit-prazo { display: block; margin-left: 24px; color: var(--suave); font-size: 12px; }
  .postit-prazo.vencida { color: var(--erro); }
  .postit-prazo.vencendo { color: var(--texto); background: var(--aviso-fundo);
    border-left: 3px solid var(--aviso-borda); padding-left: 5px; font-weight: 700; }
  .postit-vazio { margin: 0; color: var(--suave); font-size: 12px; }
  @media (max-width: 760px) {
    .topo { flex-wrap: wrap; gap: 0 12px; padding: 9px 16px 0; }
    .marca { flex: 1 1 auto; min-height: 38px; }
    .topo .encerrar { order: 1; margin-left: 0; min-height: 32px; }
    .horas-indicador { order: 1; margin-left: 0; }
    .abas { order: 2; width: 100%; flex-wrap: wrap; }
    .abas a { min-height: 40px; padding: 0 10px; font-size: 12px; }
    .menu-ferramentas summary { padding: 0 10px; font-size: 12px; }
    .app { grid-template-columns: minmax(0, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--borda); padding: 20px 16px; }
    main { padding: 20px 16px; }
    .area-titulo { display: block; }
    .grade { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .mini { height: 230px; }
  }
  @media (max-width: 600px) {
    body { padding-bottom: 44px; }
    .postit-botao { right: 8px; bottom: 8px; min-height: 32px; padding: 5px 9px; font-size: 12px; }
    .postit-painel { right: 8px; bottom: 48px; width: calc(100vw - 16px);
      max-height: min(480px, calc(100dvh - 60px)); }
  }
  @media (max-width: 430px) {
    .marca-divisor, .marca-reserva { display: none; }
    .marca-local { font-size: 12px; }
    .marca-local img { width: 34px; height: 34px; }
    .marca-app { font-size: 17px; }
    .zona { padding: 20px 14px; }
    .grade { grid-template-columns: 1fr 1fr; gap: 10px; }
    .cartao { padding: 7px; }
    .mini { height: 190px; }
    .mini.deitada img { max-width: 170px; max-height: 145px; }
    .acoes { gap: 3px; }
    .acoes button { padding: 4px 2px; font-size: 12px; }
  }
{% block estilos %}{% endblock %}
</style>
</head>
<body>
<nav class="topo" aria-label="Navegação principal">
  <div class="marca">
    <span class="marca-app">Área de trabalho</span>
    <span class="marca-divisor" aria-hidden="true"></span>
    <span class="marca-local">
      <img src="/static/logo-local.png" alt=""
           onerror="if (!this.dataset.tentouSvg) { this.dataset.tentouSvg = '1'; this.src = '/static/logo-local.svg'; } else { this.hidden = true; }">
      <span class="marca-reserva">Piau Gestão em Saúde</span>
    </span>
  </div>
  <div class="abas">
    <a href="/" class="{{ 'ativa' if pagina == 'inicio' }}"{% if pagina == 'inicio' %} aria-current="page"{% endif %}>Início</a>
    <a href="/painel/" class="{{ 'ativa' if pagina == 'painel' }}"{% if pagina == 'painel' %} aria-current="page"{% endif %}>Auditoria</a>
    <a href="/horas/" class="{{ 'ativa' if pagina == 'horas' }}"{% if pagina == 'horas' %} aria-current="page"{% endif %}>Horas</a>
    <a href="/pendencias/" class="{{ 'ativa' if pagina == 'pendencias' }}"{% if pagina == 'pendencias' %} aria-current="page"{% endif %}>Pendências</a>
    <details class="menu-ferramentas">
      <summary class="{{ 'ativa' if pagina in ('mesclar', 'converter') }}">Ferramentas</summary>
      <div class="menu-opcoes">
        <a href="/mesclar"{% if pagina == 'mesclar' %} aria-current="page"{% endif %}>Mesclar prontuário</a>
        <a href="/converter"{% if pagina == 'converter' %} aria-current="page"{% endif %}>Converter em JPG</a>
      </div>
    </details>
  </div>
  <a id="horasIndicador" class="horas-indicador" href="/horas/" hidden></a>
  <button id="encerrar" class="encerrar" type="button" title="Fecha o app (os arquivos já salvos não são afetados)">Encerrar o app</button>
</nav>

{% block conteudo %}{% endblock %}

<script>
// ================= utilitários comuns às telas =================
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// memória leve no navegador (escolhas da tela)
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lembrar = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

// ordem natural pelo caminho completo: "pasta/pag2" antes de "pasta/pag10"
const caminhoDe = f => f.caminhoRelativo || f.webkitRelativePath || f.name;
const ordemNatural = (a, b) => caminhoDe(a).localeCompare(caminhoDe(b), "pt-BR", { numeric: true });
const EXT_OK = /\.(pdf|jpe?g|png|tiff?|heic|zip)$/i;

// separa os arquivos aceitos (ignora ocultos e formatos não suportados vindos de pastas)
function filtrarArquivos(lista) {
  const todos = [...lista];
  const arquivos = todos.filter(f => !f.name.startsWith(".") && EXT_OK.test(f.name)).sort(ordemNatural);
  return { arquivos, ignorados: todos.length - arquivos.length };
}

// lê uma pasta arrastada (e subpastas), guardando o caminho relativo para ordenar
function lerEntrada(entrada, prefixo = "") {
  return new Promise(resolve => {
    if (entrada.isFile) {
      entrada.file(f => { f.caminhoRelativo = prefixo + f.name; resolve([f]); }, () => resolve([]));
    } else if (entrada.isDirectory) {
      const leitor = entrada.createReader(), filhos = [];
      const lerLote = () => leitor.readEntries(async lote => {
        if (!lote.length) {   // readEntries devolve em lotes; vazio = terminou
          const listas = await Promise.all(filhos.map(e => lerEntrada(e, prefixo + entrada.name + "/")));
          resolve(listas.flat());
        } else { filhos.push(...lote); lerLote(); }
      }, () => resolve([]));
      lerLote();
    } else resolve([]);
  });
}

// Liga a área de arrastar e os links "arquivos / .zip" e "uma pasta".
// receber(listaDeArquivos, origem) é chamado com o que chegou; origem = nome do zip/pasta.
function ativarEntrada(receber) {
  const zona = $("zona");
  $("escolher").onclick = () => $("seletor").click();
  $("escolherDir").onclick = () => $("seletorDir").click();
  $("seletor").onchange = e => {
    const zip = [...e.target.files].find(f => /\.zip$/i.test(f.name));
    receber(e.target.files, zip ? zip.name : ""); e.target.value = "";
  };
  $("seletorDir").onchange = e => {
    const pasta = e.target.files[0] ? e.target.files[0].webkitRelativePath.split("/")[0] : "";
    receber(e.target.files, pasta); e.target.value = "";
  };
  const ehArquivo = e => [...e.dataTransfer.types].includes("Files");
  document.addEventListener("dragover", e => { if (ehArquivo(e)) { e.preventDefault(); zona.classList.add("ativa"); } });
  document.addEventListener("dragleave", e => { if (!e.relatedTarget) zona.classList.remove("ativa"); });
  document.addEventListener("drop", async e => {
    if (!ehArquivo(e)) return;
    e.preventDefault(); zona.classList.remove("ativa");
    // as entradas precisam ser lidas AGORA: o navegador apaga a lista depois do evento
    const entradas = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (!entradas.length) { receber(e.dataTransfer.files, ""); return; }
    const pastas = entradas.filter(x => x.isDirectory).map(x => x.name);
    const zips = entradas.filter(x => x.isFile && /\.zip$/i.test(x.name)).map(x => x.name);
    const arquivos = (await Promise.all(entradas.map(x => lerEntrada(x)))).flat();
    receber(arquivos, [...pastas, ...zips].join(", "));
  });
}

// cada tela informa se há trabalho não salvo (para avisar antes de encerrar)
let temTrabalhoPendente = () => false;

// ---------- sessão de horas em andamento ----------
let horasInicio = null, horasEmpresa = "", horasDescricao = "";
function atualizarIndicadorHoras() {
  const indicador = $("horasIndicador");
  indicador.hidden = !horasInicio;
  if (!horasInicio) return;
  const segundos = Math.max(0, Math.floor((Date.now() - horasInicio) / 1000));
  const dois = valor => String(valor).padStart(2, "0");
  const tempo = `${dois(Math.floor(segundos / 3600))}:${dois(Math.floor(segundos / 60) % 60)}:${dois(segundos % 60)}`;
  indicador.textContent = `${horasEmpresa || "Sem empresa"} · ${tempo}`;
  indicador.title = horasDescricao;
}
async function carregarIndicadorHoras() {
  try {
    const resposta = await fetch("/horas/dados");
    if (!resposta.ok) return;
    const dados = await resposta.json();
    horasInicio = dados.ativa ? new Date(dados.ativa.inicio).getTime() : null;
    horasEmpresa = dados.ativa && dados.ativa.empresa ? dados.ativa.empresa : "";
    horasDescricao = dados.ativa ? dados.ativa.tipo + (dados.ativa.tarefa ? " · " + dados.ativa.tarefa : "") : "";
    atualizarIndicadorHoras();
  } catch (erro) { /* A navegação continua se o contador não responder. */ }
}
carregarIndicadorHoras();
window.addEventListener("horasAlteradas", carregarIndicadorHoras);
setInterval(atualizarIndicadorHoras, 1000);

// ---------- encerrar o app ----------
$("encerrar").onclick = async () => {
  if (temTrabalhoPendente() && !confirm("Há arquivos carregados que não foram salvos. Encerrar mesmo assim?")) return;
  // encerrar pelo botão também para o contador de horas, se ficou ligado
  try { await fetch("/encerrar", { method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({parar_horas: true}) }); } catch (e) {}
  // o app pede ao navegador para fechar esta aba; se não conseguir, fica a mensagem
  setTimeout(() => {
    document.body.innerHTML = '<div style="padding:40px;font:16px -apple-system,sans-serif">' +
      "Área de trabalho encerrada. Pode fechar esta aba.<br><br>Para abrir de novo, use o ícone.</div>";
  }, 300);
};
</script>
{% block script %}{% endblock %}
<button id="postitBotao" class="postit-botao" type="button" aria-controls="postitPainel" aria-expanded="false">Tarefas (0)</button>
<section id="postitPainel" class="postit-painel" aria-label="Tarefas rápidas" hidden>
  <h2>Nova tarefa</h2>
  <form id="postitFormulario" class="postit-formulario">
    <label>Descrição <input name="texto" type="text" required autocomplete="off"></label>
    <label>Empresa <select name="empresa" required></select></label>
    <label>Prazo (opcional) <input name="prazo" type="date"></label>
    <button type="submit">Salvar tarefa</button>
  </form>
  <p id="postitAviso" class="msg" role="status" aria-live="polite"></p>
  <label class="postit-filtro">Mostrar empresa
    <select id="postitFiltro"><option value="">Todas</option></select>
  </label>
  <div id="postitTarefas" aria-live="polite"></div>
</section>
<script src="{{ url_for('static', filename='postit.js') }}" defer></script>
</body>
</html>
