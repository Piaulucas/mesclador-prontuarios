<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Mesclador{% endblock %}</title>
<style>
  :root {
    --fundo: #f4f5f7; --painel: #ffffff; --borda: #d9dce1; --texto: #1d2129;
    --suave: #6b7280; --acento: #1f6feb; --acento-txt: #ffffff;
    --ok: #1a7f37; --erro: #cf222e; --alvo: #e8f0fe; --topo: 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #16181c; --painel: #1f2228; --borda: #353a42; --texto: #e6e8eb;
      --suave: #9aa1ab; --acento: #4c8dff; --acento-txt: #0b0d10;
      --ok: #3fb950; --erro: #f85149; --alvo: #1d2a40;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--fundo); color: var(--texto); }

  /* ---------- barra superior ---------- */
  .topo { height: var(--topo); display: flex; align-items: center; gap: 24px; padding: 0 20px;
          background: var(--painel); border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 10; }
  .marca { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .abas { display: flex; gap: 4px; height: 100%; }
  .abas a { display: flex; align-items: center; padding: 0 14px; color: var(--suave); text-decoration: none;
            border-bottom: 2px solid transparent; font-weight: 500; }
  .abas a:hover { color: var(--texto); }
  .abas a.ativa { color: var(--acento); border-bottom-color: var(--acento); }
  .topo .encerrar { margin-left: auto; color: var(--suave); font-size: 12px; }

  /* ---------- componentes comuns ---------- */
  .app { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - var(--topo)); }
  aside { background: var(--painel); border-right: 1px solid var(--borda); padding: 20px;
          display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--suave); }
  input, select { font: inherit; color: var(--texto); background: var(--fundo);
                  border: 1px solid var(--borda); border-radius: 6px; padding: 7px 9px; }
  input:focus, select:focus { outline: 2px solid var(--acento); outline-offset: -1px; }
  .msg { font-size: 12px; min-height: 16px; }
  .msg.erro { color: var(--erro); } .msg.ok { color: var(--ok); }
  hr { border: 0; border-top: 1px solid var(--borda); margin: 4px 0; width: 100%; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--borda);
           background: var(--painel); color: var(--texto); padding: 7px 12px; }
  button.principal { background: var(--acento); color: var(--acento-txt); border-color: var(--acento);
                     font-weight: 600; padding: 10px; }
  button:disabled { opacity: .5; cursor: default; }
  main { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .zona { border: 2px dashed var(--borda); border-radius: 10px; padding: 18px; text-align: center;
          color: var(--suave); background: var(--painel); }
  .zona.ativa { border-color: var(--acento); background: var(--alvo); color: var(--texto); }
  .zona a { color: var(--acento); cursor: pointer; text-decoration: underline; }
  .barra { display: flex; justify-content: space-between; align-items: center; color: var(--suave); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .cartao { background: var(--painel); border: 1px solid var(--borda); border-radius: 8px; padding: 8px;
            position: relative; user-select: none; }
  .ordem { position: absolute; top: 6px; left: 6px; background: var(--acento); color: var(--acento-txt);
           border-radius: 10px; min-width: 22px; height: 22px; font-size: 12px; font-weight: 700;
           display: grid; place-items: center; padding: 0 6px; z-index: 1; }
  .mini { height: 200px; position: relative; overflow: hidden; border-radius: 4px; background: var(--fundo); }
  .mini img { position: absolute; top: 50%; left: 50%; max-width: 100%; max-height: 100%;
              transition: transform .15s; pointer-events: none; }
  /* girada 90°/270°: limita pelo lado oposto, porque largura e altura se invertem */
  .mini.deitada img { max-width: 200px; max-height: 150px; }
  .nome { font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info { font-size: 11px; color: var(--suave); }
  .acoes { display: flex; gap: 6px; margin-top: 6px; }
  .acoes button { flex: 1; padding: 4px; font-size: 12px; }
  .vazio { color: var(--suave); text-align: center; padding: 40px; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; } aside { border-right: 0; }
    .marca { display: none; }
  }
{% block estilos %}{% endblock %}
</style>
</head>
<body>
<nav class="topo">
  <span class="marca">Mesclador</span>
  <div class="abas">
    <a href="/" class="{{ 'ativa' if pagina == 'mesclar' }}">Mesclar prontuário</a>
    <a href="/converter" class="{{ 'ativa' if pagina == 'converter' }}">Converter em JPG</a>
  </div>
  <button id="encerrar" class="encerrar" type="button" title="Fecha o app (os arquivos já salvos não são afetados)">Encerrar o app</button>
</nav>

{% block conteudo %}{% endblock %}

<script>
// ================= utilitários comuns às telas =================
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// memória leve no navegador (escolhas da tela)
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lembrar = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

// ordem natural pelo caminho completo: "pasta/pag2" antes de "pasta/pag10"
const caminhoDe = f => f.caminhoRelativo || f.webkitRelativePath || f.name;
const ordemNatural = (a, b) => caminhoDe(a).localeCompare(caminhoDe(b), "pt-BR", { numeric: true });
const EXT_OK = /\.(pdf|jpe?g|png|tiff?|heic|zip)$/i;

// separa os arquivos aceitos (ignora ocultos e formatos não suportados vindos de pastas)
function filtrarArquivos(lista) {
  const todos = [...lista];
  const arquivos = todos.filter(f => !f.name.startsWith(".") && EXT_OK.test(f.name)).sort(ordemNatural);
  return { arquivos, ignorados: todos.length - arquivos.length };
}

// lê uma pasta arrastada (e subpastas), guardando o caminho relativo para ordenar
function lerEntrada(entrada, prefixo = "") {
  return new Promise(resolve => {
    if (entrada.isFile) {
      entrada.file(f => { f.caminhoRelativo = prefixo + f.name; resolve([f]); }, () => resolve([]));
    } else if (entrada.isDirectory) {
      const leitor = entrada.createReader(), filhos = [];
      const lerLote = () => leitor.readEntries(async lote => {
        if (!lote.length) {   // readEntries devolve em lotes; vazio = terminou
          const listas = await Promise.all(filhos.map(e => lerEntrada(e, prefixo + entrada.name + "/")));
          resolve(listas.flat());
        } else { filhos.push(...lote); lerLote(); }
      }, () => resolve([]));
      lerLote();
    } else resolve([]);
  });
}

// Liga a área de arrastar e os links "arquivos / .zip" e "uma pasta".
// receber(listaDeArquivos, origem) é chamado com o que chegou; origem = nome do zip/pasta.
function ativarEntrada(receber) {
  const zona = $("zona");
  $("escolher").onclick = () => $("seletor").click();
  $("escolherDir").onclick = () => $("seletorDir").click();
  $("seletor").onchange = e => {
    const zip = [...e.target.files].find(f => /\.zip$/i.test(f.name));
    receber(e.target.files, zip ? zip.name : ""); e.target.value = "";
  };
  $("seletorDir").onchange = e => {
    const pasta = e.target.files[0] ? e.target.files[0].webkitRelativePath.split("/")[0] : "";
    receber(e.target.files, pasta); e.target.value = "";
  };
  const ehArquivo = e => [...e.dataTransfer.types].includes("Files");
  document.addEventListener("dragover", e => { if (ehArquivo(e)) { e.preventDefault(); zona.classList.add("ativa"); } });
  document.addEventListener("dragleave", e => { if (!e.relatedTarget) zona.classList.remove("ativa"); });
  document.addEventListener("drop", async e => {
    if (!ehArquivo(e)) return;
    e.preventDefault(); zona.classList.remove("ativa");
    // as entradas precisam ser lidas AGORA: o navegador apaga a lista depois do evento
    const entradas = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (!entradas.length) { receber(e.dataTransfer.files, ""); return; }
    const pastas = entradas.filter(x => x.isDirectory).map(x => x.name);
    const zips = entradas.filter(x => x.isFile && /\.zip$/i.test(x.name)).map(x => x.name);
    const arquivos = (await Promise.all(entradas.map(x => lerEntrada(x)))).flat();
    receber(arquivos, [...pastas, ...zips].join(", "));
  });
}

// cada tela informa se há trabalho não salvo (para avisar antes de encerrar)
let temTrabalhoPendente = () => false;

// ---------- encerrar o app ----------
$("encerrar").onclick = async () => {
  if (temTrabalhoPendente() && !confirm("Há arquivos carregados que não foram salvos. Encerrar mesmo assim?")) return;
  try { await fetch("/encerrar", { method: "POST" }); } catch (e) {}
  // o app pede ao navegador para fechar esta aba; se não conseguir, fica a mensagem
  setTimeout(() => {
    document.body.innerHTML = '<div style="padding:40px;font:16px -apple-system,sans-serif">' +
      "Mesclador encerrado. Pode fechar esta aba.<br><br>Para abrir de novo, use o ícone.</div>";
  }, 300);
};
</script>
{% block script %}{% endblock %}
</body>
</html>
