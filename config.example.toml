# Copie este arquivo para config.toml e ajuste para o seu computador.
# O config.toml NÃO vai para o git (veja .gitignore).

# Onde o seletor de pasta abre na primeira vez. A pasta principal de cada mês
# é escolhida na tela; dentro dela o app usa a subpasta do tipo (ADULTO.../NEO...).
pasta_inicial = "~/Documents"

porta = 5050

# Primeiro mês de uso (AAAA-MM). Meses anteriores não aparecem nem podem ser salvos.
mes_inicial = "2026-10"

# Empresa = pasta onde ficam as planilhas de faturamento dela (.xlsx/.xlsm).
# O app pré-seleciona a planilha cujo caminho contém o mês e o ano escolhidos
# (ex.: ".../2026/OUTUBRO.xlsx" ou ".../faturamento_2026-10.xlsx").
# Deixe "" para uma empresa sem planilha (o nome é digitado à mão).
[empresas]
"EMPRESA EXEMPLO A" = "~/Documents/faturamento/empresa-a"
"EMPRESA EXEMPLO B" = ""

# Banco local das faturas e tarefas, fora do projeto. Não guarde nomes de pacientes.
[trabalho]
arquivo = "~/Library/Application Support/Mesclador/trabalho.db"

# Prazo após a chegada do ofício de glosa e janela de alerta, em dias corridos.
# fatura_dia: a fatura de cada competência deve ser enviada até este dia do mês
# seguinte (dia fixo, não é dia útil; vale para todas as empresas).
[prazos]
glosa_dias = 60
alerta_dias = 10
fatura_dia = 5

# Registros manuais da auditoria, fora do projeto e das pastas das empresas.
[auditoria]
pasta_registros = "~/Library/Application Support/Mesclador/auditoria"

# Pasta de prontuários do mês por empresa. {ano}, {mm} e {MES} são substituídos
# pelo ano, mês com dois dígitos e nome do mês em maiúsculas.
[auditoria.prontuarios]
"EMPRESA EXEMPLO A" = "~/Documents/exemplo/EMPRESA A/PRONTUARIOS/{ano}/{mm}_{MES}"

# Atalhos das pastas compartilhadas no Meu Drive (Google Drive para desktop).
# Configure a raiz completa de cada empresa; os nomes das pastas de mês variam.
# Formatos aceitos: pastas_por_paciente e arquivos_soltos.
[auditoria.scanners."EMPRESA EXEMPLO A"]
pasta = "~/Library/CloudStorage/GoogleDrive-exemplo/Meu Drive/SCANNERS/EMPRESA A"
formato = "pastas_por_paciente"

[auditoria.scanners."EMPRESA EXEMPLO B"]
pasta = "~/Library/CloudStorage/GoogleDrive-exemplo/Meu Drive/SCANNERS/EMPRESA B"
formato = "arquivos_soltos"

# Tipos de remoção (cada um é uma aba da planilha e uma subpasta de destino).
# nomes_aba      = nomes que a aba pode ter (varia entre empresas); o primeiro que existir é usado
# col_numero     = letra da coluna com o Nº da remoção
# col_nome       = letra da coluna com o nome do paciente
# primeira_linha = primeira linha com dados (abaixo do cabeçalho)
# palavra_subpasta = dentro da pasta principal, usa a subpasta cujo nome começa com esta palavra;
#                    se não existir, cria uma com o nome do tipo
# codigo         = código da ficha para auditoria (padrão: 3 primeiras letras do tipo, em maiúsculas)
# Atenção: a numeração recomeça em cada aba, por isso a busca é feita só na aba do tipo escolhido.
[abas."ADULTO-PED"]
nomes_aba = ["ADULTO-PED", "Remoção ADULTO-PED"]
col_numero = "B"
col_nome = "D"
primeira_linha = 16
palavra_subpasta = "ADULTO"

[abas."NEONATAL"]
nomes_aba = ["NEONATAL", "Remoção NEONATAL"]
col_numero = "B"
col_nome = "D"
primeira_linha = 16
palavra_subpasta = "NEO"

[abas."ADULTO-PED COVID"]
nomes_aba = ["ADULTO-PED COVID", "Remoção ADULTO-PED COVID"]
col_numero = "B"
col_nome = "D"
primeira_linha = 16
palavra_subpasta = "ADULTO_PED_COVID"
codigo = "COV"

[abas."NEONATAL COVID"]
nomes_aba = ["NEONATAL COVID", "Remoção NEONATAL COVID"]
col_numero = "B"
col_nome = "D"
primeira_linha = 16
palavra_subpasta = "NEONATAL_COVID"
codigo = "NCV"
